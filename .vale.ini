# Project voice for everything written here: markdown, commit messages, merge
# request descriptions, and the text the site shows in its Vue templates.
# .gitlab/scripts/lint-prose.sh feeds the first three through this
# configuration, and `npm run lint:prose:site` the templates.
#
# StylesPath is populated by .gitlab/scripts/install-vale.sh, pinned and
# verified by checksum, rather than by `vale sync`.
StylesPath = .vale/styles
MinAlertLevel = error

# A Vue single-file component is read as HTML: the template's text is linted,
# and <script>, <style> and code are skipped.
[formats]
vue = html

[*.{md,vue}]
BasedOnStyles = ai-tells
