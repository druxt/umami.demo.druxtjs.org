; Overrides for the Docker-free dev workflow, loaded via PHP_INI_SCAN_DIR.
;
; A demo_umami install builds every view, block, media type and menu in one
; process and exceeds PHP's default 128M. Drush's launcher does not honour
; PHP_OPTIONS in this version, so the limit is set here instead.
memory_limit = -1

; Umami ships large recipe photography.
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 300
