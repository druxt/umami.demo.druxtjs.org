# Umami prefixes every language, English included, so the front page is /en and
# "/" is not a page. Nuxt generate writes a client-side redirect stub there,
# which paints nothing; force = true makes Netlify serve this 301 instead of
# that file.
[[redirects]]
  from = "/"
  to = "/en"
  status = 301
  force = true

# Each language proxies to its own prefix on the backend. These were rotated
# by one, so a Spanish page asked the English API and the language switch
# failed with a network error.
[[redirects]]
  from = "/en/jsonapi*"
  to = "https://api.umami.demo.druxtjs.org/en/jsonapi:splat"

[[redirects]]
  from = "/es/jsonapi*"
  to = "https://api.umami.demo.druxtjs.org/es/jsonapi:splat"

[[redirects]]
  from = "/jsonapi*"
  to = "https://api.umami.demo.druxtjs.org/jsonapi:splat"

[[redirects]]
  from = "/router/translate-path*"
  to = "https://api.umami.demo.druxtjs.org/router/translate-path:splat"
