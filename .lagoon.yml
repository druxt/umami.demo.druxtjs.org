---
docker-compose-yaml: docker-compose.yml

project: druxtjs-org-demo-umami

# The whole demo is one environment: Drupal, the site and Storybook together,
# so the production environment keeps all of it awake.
environments:
  main:
    routes:
      - app:
          - umami.demo.druxtjs.org
      - nginx:
          - api.umami.demo.druxtjs.org
      - storybook:
          - storybook.umami.demo.druxtjs.org
    cronjobs:
      - name: drush cron
        schedule: "*/15 * * * *"
        command: drush cron
        service: cli

tasks:
  post-rollout:
    # A fresh umami on every deploy: the demo resets to its known content.
    - run:
        name: drupal install
        command: >-
          DRUPAL_DB_URL="mysql://${MARIADB_USERNAME}:${MARIADB_PASSWORD}@${MARIADB_HOST}:${MARIADB_PORT}/${MARIADB_DATABASE}"
          .devtools/provision
        service: cli

    # The fresh demo, kept, so the reset route can put it back in seconds.
    - run:
        name: snapshot the fresh demo
        command: .devtools/snapshot
        service: cli

    # New content means new entity IDs, so the site builds again from it.
    - run:
        name: regenerate the site
        command: curl -fsS --retry 5 --retry-connrefused -X POST http://app:3000/_regenerate
        service: cli

    - run:
        name: drush user:login
        command: drush user:login
        service: cli
