---
name: test-preview

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test_preview:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [16]

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7

      - name: Setup node env 🏗
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - name: Cache node_modules 📦
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install frontend dependencies 👨🏻‍💻
        run: cd nuxt && yarn install

      - name: Run linter 👀
        run: cd nuxt && yarn lint

      - name: Setup ddev
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false
      - name: Start ddev
        run: cd drupal && ddev start

      - name: Install Drupal 👨🏻‍💻
        run: cd drupal && ddev drupal-install

      - name: Run tests 🧪
        run: cd nuxt && BASE_URL=http://druxt-js-demo-umami.ddev.site yarn test

      - name: Generate dist 👨🏻‍💻
        # The runner's backend is gone once the job ends, and Umami's demo
        # files have the same names on production, so the preview loads its
        # images from there.
        run: >-
          cd nuxt &&
          PUBLIC_BASE_URL=https://api.umami.demo.druxtjs.org yarn generate

      - name: Deploy to Netlify
        id: netlify
        uses: nwtgck/actions-netlify@v1.2
        with:
          publish-dir: './nuxt/dist'
          # The action uploads the publish dir only; without this the
          # redirects in netlify.toml never reach a preview.
          netlify-config-path: ./netlify.toml
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
          enable-pull-request-comment: true
          enable-commit-comment: true
          overwrites-pull-request-comment: true
          github-deployment-environment: ${{ github.head_ref }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 1

      - name: Check the root redirect 🔁
        # Cypress ran against the local dist, where Nuxt's client-side stub
        # does the redirect. Only the deployed site proves Netlify's 301.
        run: |
          headers=$(curl -sSI --max-time 20 "${{ steps.netlify.outputs.deploy-url }}/")
          echo "$headers"
          echo "$headers" | grep -q '^HTTP/[0-9.]* 301'
          echo "$headers" | grep -qi '^location: /en\r\?$'

      - uses: actions/upload-artifact@v7
        with:
          name: cypress-videos
          path: nuxt/cypress/videos
          # v4 fails on no matches where v3 only warned, and this step has no
          # `if:`, so a run with no video would go red.
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-screenshots
          path: nuxt/cypress/screenshots
          if-no-files-found: ignore
